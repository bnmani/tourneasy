packages:
  - 'apps/*'
  - 'packages/*'

# Flat, real node_modules (no .pnpm symlink farm). Hostinger copies the standalone build with
# symlinks dereferenced, which breaks packages that find their peers through pnpm's layout
# (next → react-dom, @prisma/client → .prisma/client).
nodeLinker: hoisted

# Security overrides for transitive dependencies whose parents still pin vulnerable versions
# (see DECISIONS.md D24). Remove once the parent packages ship the fix themselves.
overrides:
  # next 15.5.x pins postcss 8.4.31 (GHSA-fxqj-rqcc-2cmp and related; build-time only)
  postcss: ^8.5.23
  # @prisma/config pins deepmerge-ts 7.x (stack exhaustion; Prisma CLI only)
  deepmerge-ts: ^8.0.0
  # typescript-estree (lint only) pins minimatch 9.x (globparts amplification)
  '@typescript-eslint/typescript-estree>minimatch': '>=11.0.1'
  # Dependabot #18 (GHSA-g3hv-75wg-m249): minimatch >=7 <11.0.1 is vulnerable. Dev/build tooling only
  # (Expo CLI, Jest, ESLint). Range-scoped so the old minimatch 3.x used by eslint is left alone.
  'minimatch@>=7.0.0 <11.0.1': '>=11.0.1'
  # Dependabot #17 (GHSA-3g3m-2fjr-6pw4): glob >=9 <=14.0.1 is vulnerable. Range-scoped so glob 7.x
  # (used by istanbul/jest) is not forced onto the new major.
  'glob@>=9.0.0 <14.0.2': '>=14.0.2'

# Dependencies allowed to run install scripts (pnpm 11).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  '@parcel/watcher': false
  '@swc/core': false
  unrs-resolver: false
  # Sentry CLI downloads a binary; only needed later for uploading source maps (approve then).
  '@sentry/cli': false

minimumReleaseAgeExclude:
  - '@expo/config-plugins@58.0.14'
  - expo-file-system@58.0.15
  - expo-notifications@58.1.10
  - expo-sharing@58.0.24
