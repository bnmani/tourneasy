name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tourneasy
          POSTGRES_PASSWORD: tourneasy
          POSTGRES_DB: tourneasy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tourneasy -d tourneasy"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://tourneasy:tourneasy@localhost:5432/tourneasy?schema=public
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SEED_ADMIN_PASSWORD: ci-admin-password
      SEED_PLAYER_PASSWORD: ci-player-password
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrate and seed database
        run: pnpm --filter @tourneasy/db exec prisma migrate deploy && pnpm --filter @tourneasy/db exec prisma db seed
      - run: pnpm test
      - run: pnpm build
