# Local development services.
#   docker compose up -d                  → Postgres + Mailpit (run the app on your machine with `pnpm dev`)
#   docker compose --profile app up       → also run the Next.js app in a container
name: tourneasy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tourneasy
      POSTGRES_PASSWORD: tourneasy
      POSTGRES_DB: tourneasy
      TZ: UTC
    ports:
      - '127.0.0.1:5432:5432' # localhost only — dev credentials are not secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tourneasy -d tourneasy']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP (localhost only)
      - '127.0.0.1:8025:8025' # Web UI → http://localhost:8025

  app:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tourneasy:tourneasy@postgres:5432/tourneasy?schema=public
      SMTP_HOST: mailpit
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/app
      # Keep Linux node_modules inside the container, separate from the host's.
      - node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - db_node_modules:/app/packages/db/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
  web_node_modules:
  db_node_modules:
  shared_node_modules:
